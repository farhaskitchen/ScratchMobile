name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-scratch-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20 (matches scratch-gui .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone scratch-gui base
        run: git clone --depth 1 https://github.com/scratchfoundation/scratch-gui.git vendor/scratch-gui

      - name: Install scratch-gui deps
        working-directory: vendor/scratch-gui
        run: npm install --legacy-peer-deps || true
        # prepublish hook fails fetching hardware firmware zips (micro:bit/EV3) which
        # we don't need -- node_modules is already populated by the time that step runs

      - name: Build scratch-gui
        working-directory: vendor/scratch-gui
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Commit build log on failure (debug only)
        if: failure()
        run: |
          mkdir -p /tmp/out
          tail -n 200 /tmp/build.log > /tmp/out/last-build-error.log
          cd "$GITHUB_WORKSPACE"
          cp /tmp/out/last-build-error.log ./last-build-error.log
          git config user.email "ci@scratchmobile.local"
          git config user.name "ScratchMobile CI"
          git add last-build-error.log
          git commit -m "CI: build error log [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main || echo "push failed, continuing"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scratch-gui-build
          path: vendor/scratch-gui/build/
