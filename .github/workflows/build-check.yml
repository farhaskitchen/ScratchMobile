name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20 (matches scratch-gui .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone scratch-gui base
        run: git clone --depth 1 https://github.com/scratchfoundation/scratch-gui.git vendor/scratch-gui

      - name: Install scratch-gui deps
        working-directory: vendor/scratch-gui
        run: npm ci || true
        # prepublish hook fails fetching hardware firmware zips (micro:bit/EV3) which
        # we don't need -- node_modules is already populated by the time that step runs.
        # `npm ci` (not --legacy-peer-deps) resolves exactly against package-lock.json,
        # matching upstream CI and avoiding dependency-tree drift that broke
        # react-virtualized's resolution of 'react'.

      - name: Stub microbit firmware URL (skip hardware extension asset)
        working-directory: vendor/scratch-gui
        run: |
          mkdir -p src/generated
          cat > src/generated/microbit-hex-url.cjs << 'EOF'
          // Stub: micro:bit firmware not fetched in CI (hardware extension unused by ScratchMobile).
          module.exports = '';
          EOF

      - name: Install our app deps
        run: npm install
        # postinstall (scripts/link-scratch-gui-deps.js) symlinks scratch-webpack-configuration's
        # peer loader packages in from vendor/scratch-gui/node_modules once it exists (it does by now).

      - name: Build ScratchMobile
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Save build log as artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: /tmp/build.log

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scratchmobile-build
          path: build/
